# Continuous integration: lint + tests on every push / pull request.
# Tests that need downloaded trial data skip themselves automatically, so CI uses
# synthetic data only. No patient data ever leaves the public sources.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU PyTorch and pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          pip install numpy==1.26.4 pandas==2.2.3 scipy==1.14.1 scikit-learn==1.5.2 \
                      lightgbm==4.5.0 lifelines==0.29.0 statsmodels==0.14.4 captum==0.7.0 \
                      matplotlib==3.9.2 pytest==8.3.3 ruff==0.7.4
          pip install -e . --no-deps
      - name: Lint
        run: ruff check src tests scripts lessons
      - name: Tests
        run: pytest -q
